<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6a48">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230d6a48%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3EМ%3C/text%3E%3C/svg%3E">
<title>Наш маршрут</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Маршрут">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
html,body{margin:0}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent} /* без зума по двойному тапу, щипок работает */

/* Layout: one-screen phone app — street-sign header, scrolling body, tab bar; map tab is full-bleed. */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --surface-2:#e7eae4; --fg:#17201b; --muted:#5a665f; --line:#d3d8d1;
  --accent:#0d6a48; --accent-2:#0a5539; --accent-fg:#ffffff; --taxi:#f2b705; --taxi-fg:#1d1a0b; --danger:#b3261e;
  --water:#cbdbe2; --shadow:0 6px 24px rgba(20,30,25,.14);
  --c-food:#ee352e; --c-coffee:#8a5a2b; --c-museum:#0039a6; --c-view:#ff6319; --c-walk:#00933c; --c-shop:#fccc0a; --c-other:#7d8580;
  --f-display:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --surface-2:#232a26; --fg:#e5ebe6; --muted:#98a49d; --line:#313a35;
  --accent:#36a97b; --accent-2:#2c8f67; --accent-fg:#06120c; --taxi:#f5c43a; --taxi-fg:#1d1a0b; --danger:#ef7d74;
  --water:#142229; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --surface-2:#232a26; --fg:#e5ebe6; --muted:#98a49d; --line:#313a35;
  --accent:#36a97b; --accent-2:#2c8f67; --accent-fg:#06120c; --taxi:#f5c43a; --taxi-fg:#1d1a0b; --danger:#ef7d74;
  --water:#142229; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;min-height:0}

/* Header: street sign */
.top{flex:none;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:10px;align-items:center}
.sign{flex:1;min-width:0;background:#0d6a48;color:#fff;border-radius:8px;padding:3px}
.sign-in{border:2px solid rgba(255,255,255,.92);border-radius:6px;padding:4px 10px 5px;display:flex;align-items:baseline;gap:10px;min-width:0}
.trip-name{flex:0 1 auto;min-width:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-meta{flex:1 1 0;min-width:0;font-family:var(--f-mono);font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:500;font-size:14px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--muted);font-weight:400}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.wrap{max-width:760px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:6px 28px}

/* Tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{background:none;border:0;padding:9px 4px 10px;min-height:52px;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Banners, buttons */
.banner{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.banner.warn{border-left:4px solid var(--taxi)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;min-height:36px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Category bullet (subway-style) */
.bullet{flex:none;width:28px;height:28px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1}
.bullet.dark{color:#1d1a0b}
.bullet.sm{width:20px;height:20px;font-size:11px}
.bullet.base{border-radius:7px;background:var(--fg);color:var(--bg)}
.bullet.base svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.lpin .bullet.base{border-color:var(--surface)}
.bases{display:flex;flex-direction:column;gap:8px}
.base-row{display:flex;gap:10px;align-items:center}
.base-row .nm{flex:1;min-width:0;border:0;background:none;padding:4px 0;text-align:left;font-weight:500}
.base-row .nm span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.suggest{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Places toolbar & filters */
.toolbar{display:flex;gap:8px;margin:6px 0 10px}
.search{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 7px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.nobullet{padding-left:10px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));font-weight:500}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.filters2{display:flex;gap:8px;align-items:center;margin:8px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 11px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);font-weight:500}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:36px;font-size:13px;max-width:100%}

/* Place card */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.card-h{display:flex;gap:10px;align-items:flex-start}
.card-h .ttl{flex:1;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.status{flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.status.planned{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.status.done{background:var(--fg);color:var(--bg)}
.why{margin:0;font-size:14px;overflow-wrap:anywhere;white-space:pre-line}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.votes{display:flex;gap:6px;flex-wrap:wrap}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.vote b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted)}
.vote[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.vote.v2[aria-pressed="true"]{border-color:var(--taxi);background:color-mix(in srgb,var(--taxi) 28%,var(--surface))}
.voters{font-size:12px;color:var(--muted);width:100%}
.card-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.card-f a{color:var(--accent);font-size:13px;font-weight:500;text-decoration:none;padding:10px 4px}
.score{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--fg);font-weight:500;letter-spacing:.03em;font-size:22px;margin:0 0 6px;text-transform:uppercase}
.empty p{margin:0 auto 14px;max-width:34ch}

/* Map */
.map-wrap{position:absolute;inset:0}
.map-top{position:absolute;top:8px;left:0;right:0;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.map-top>*{pointer-events:auto}
.map-top .chips .chip{box-shadow:0 1px 4px rgba(0,0,0,.12)}
.map-top select{align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.map-zoom{position:absolute;right:calc(var(--gut-r));top:96px;display:flex;flex-direction:column;gap:6px}
.map-zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.12);display:grid;place-items:center}
.map-zoom svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.map-note{position:absolute;right:var(--gut-r);bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.map-card{position:absolute;left:var(--gut-l);right:var(--gut-r);bottom:10px;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;max-height:60%;overflow:auto}
.map-card .x{position:absolute;right:2px;top:2px;border:0;background:none;font-size:22px;color:var(--muted);width:42px;height:42px}
.near{font-size:13px;color:var(--muted)}
.near button{border:0;background:none;color:var(--accent);padding:7px 0;font-size:13px;text-decoration:underline;text-underline-offset:2px}

/* Plan */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;scroll-margin-top:8px}
.day.past{opacity:.7}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.today-b{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--taxi);color:var(--taxi-fg)}
.day-h{display:flex;align-items:baseline;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day-h h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.day-h .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:13px}
.stop .num.done{background:var(--muted)}
.stop .nm{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left}
.stop .nm b{font-weight:500;display:block;overflow-wrap:anywhere}
.stop .nm span{font-size:12px;color:var(--muted)}
.stop .leg{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ico{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none}
.ico:disabled{opacity:.35}
.mv{display:flex;flex-direction:column;gap:4px;flex:none}
.mv .ico{height:30px}
.day-f{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2)}
.section-t{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}

/* Trip */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 12px;display:inline-flex;align-items:center;gap:4px;font-size:14px;background:var(--surface)}
.person.me-p{border-color:var(--accent);font-weight:500}
.person button{border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:15px}
.person.confirm{border-color:var(--danger);color:var(--danger)}
.person.confirm button{color:var(--danger)}
.trips-l{display:flex;flex-direction:column;gap:6px}
.trip-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.trip-row[aria-current="true"]{border-color:var(--accent)}
.trip-row b{font-weight:500}
.trip-row span{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;overscroll-behavior:contain;border-radius:16px 16px 0 0;padding-top:14px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));padding-left:var(--gut-l);padding-right:var(--gut-r);box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet h2{margin:0 0 12px;font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label,.lab{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:8px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.coord{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.coord .st{flex:1;min-width:140px;font-size:13px}
.coord .st code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
details.more{margin-bottom:12px}
details.more summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--accent);padding:4px 0}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;width:100%}
.pick-item .nm{flex:1;min-width:0}
.pick-item .nm span{display:block;font-size:12px;color:var(--muted);font-family:var(--f-mono)}

/* Picker overlay */
.picker{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.picker .pm{position:relative;flex:1;min-height:0}
.cross{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:none}
.cross svg{width:100%;height:100%;stroke:var(--danger);stroke-width:2.5;fill:none}
.picker-bar{padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--surface)}
.picker-bar p{flex:1;min-width:180px;margin:0;font-size:13px;color:var(--muted)}

.toast-act{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;padding:6px 0 6px 8px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.nag{text-align:center;padding:6px 0 4px}
.nag-t{display:inline-block;background:#0d6a48;color:#fff;border-radius:10px;padding:4px;margin:4px 0 14px;animation:nag-pop .5s ease}
.nag-t span{display:block;border:3px solid #fff;border-radius:7px;padding:10px 22px 12px;font:600 40px/1.05 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.nag .sheet-actions{justify-content:center}
@keyframes nag-pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}70%{transform:scale(1.06) rotate(1deg)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.card.flash,.nag-t{animation:none}}

/* Leaflet map */
#lmap,.lhost{position:absolute;inset:0;background:var(--water)}
.leaflet-container{font-family:var(--f-body);background:var(--water)}
.lpin{background:none;border:0}
.lpin .bullet{width:26px;height:26px;font-size:14px;border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lpin .bullet.hot{box-shadow:0 0 0 3px var(--taxi),0 1px 4px rgba(0,0,0,.35)}
.lpin .bullet.sel{transform:scale(1.3);border-color:var(--fg)}
.lpin .bullet.dim{opacity:.4}
.leaflet-control-attribution{font-size:10px}

<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="net" id="net" hidden>Нет сети. Показываю сохранённое, изменения отправятся сами.</div>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
</div>
<div id="sheet-root"></div>
<script>
"use strict";
const CATS = [
  {id:'food',name:'Еда',l:'Е',c:'var(--c-food)'},
  {id:'coffee',name:'Кофе',l:'К',c:'var(--c-coffee)'},
  {id:'museum',name:'Музеи',l:'М',c:'var(--c-museum)'},
  {id:'view',name:'Виды',l:'В',c:'var(--c-view)'},
  {id:'walk',name:'Прогулки',l:'П',c:'var(--c-walk)'},
  {id:'shop',name:'Шопинг',l:'Ш',c:'var(--c-shop)',dark:true},
  {id:'other',name:'Другое',l:'Д',c:'var(--c-other)'}
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const catId = p => CAT[p.category] ? p.category : 'other'; // старые или неизвестные категории (например, бывшие «Бары») считаем «Другим»
const VOTES = [{v:2,label:'Очень хочу'},{v:1,label:'Можно'},{v:-1,label:'Пропущу'}];

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const num = v => (v===''||v==null||isNaN(+v)) ? null : +v;
function safeUrl(u){ try{ const x=new URL(String(u).trim()); return /^https?:$/.test(x.protocol)?x.href:null }catch(e){ return null } }
function haversine(a,b){ const R=6371, t=Math.PI/180; const dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t; const s=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const hasPt = p => p && typeof p.lat==='number' && typeof p.lng==='number' && !isNaN(p.lat) && !isNaN(p.lng);
function km(d){ return d<1 ? Math.round(d*1000/10)*10+' м' : d.toFixed(1).replace('.',',')+' км'; }
function fmtDay(d,long){ if(!d) return ''; const dt=new Date(d+'T12:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('ru-RU', long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'}); }
const isoDay = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
function addDays(d,n){ const dt=new Date(d+'T12:00:00'); if(isNaN(dt)) return todayISO(); dt.setDate(dt.getDate()+n); return isoDay(dt); }
function todayISO(){ return isoDay(new Date()); }
const dur = p => { const n=Math.round(+p.duration); return n>0&&n<10000?n:0; };
function votesOf(p){ const v=p.votes||{}; const r={2:[],1:[],'-1':[]}; for(const [n,x] of Object.entries(v)){ if(r[x]) r[x].push(n); } return r; }
function score(p){ const r=votesOf(p); return r[2].length*2+r[1].length-r[-1].length; }
function statusOf(p){ return p.done?'done':(p.day?'planned':'idea'); }
const STATUS_L = {idea:'Идея',planned:'В плане',done:'Были'};
// Открыть в Google Maps: своя ссылка Google как есть, иначе точные координаты (поиск по названию находит не то), и только без точки — по названию
function gmUrl(p,city){ const l=safeUrl(p.link); if(l&&isGmaps(l)) return l; const q = hasPt(p) ? `${p.lat},${p.lng}` : [p.name,p.address||city].filter(Boolean).join(', '); return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); }
function goUrl(p,city){ const q = hasPt(p) ? `${p.lat},${p.lng}` : [p.name,p.address||city].filter(Boolean).join(', '); return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q); }
const normName = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/^the\s+/,'').replace(/['’]s\b/g,'').replace(/[^\p{L}\p{N}]+/gu,'');
function dirUrl(list,origin){ const pts=list.filter(hasPt); if(hasPt(origin)) pts.unshift(origin); if(pts.length<2) return null; const f=p=>`${p.lat},${p.lng}`; const mid=pts.slice(1,-1).slice(0,8).map(f).join('|'); return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(f(pts[0]))+'&destination='+encodeURIComponent(f(pts[pts.length-1]))+(mid?'&waypoints='+encodeURIComponent(mid):''); }
function parseLink(link){
  const s=String(link||''); let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&](?:q|query|ll|destination|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i) || s.match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/);
  const out={}; if(m){ const lat=+m[1], lng=+m[2]; if(Math.abs(lat)<=90&&Math.abs(lng)<=180){ out.lat=lat; out.lng=lng; } }
  const n = s.match(/\/maps\/place\/([^/@?]+)/); if(n){ try{ out.name=decodeURIComponent(n[1].replace(/\+/g,' ')); }catch(e){} }
  return out;
}
// act: {label, fn} — кнопка в тосте (например, «Вернуть как было»); такой тост висит дольше
function toast(msg,act){
  document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  if(act){ const b=document.createElement('button'); b.className='toast-act'; b.textContent=act.label; b.onclick=()=>{ t.remove(); act.fn(); }; t.append(' ',b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(),act?8000:2600);
}
const newId = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCwdddfqEoJ8mByhy35FIRTV0uqo-o89kU",
  authDomain: "nash-marshrut.firebaseapp.com",
  projectId: "nash-marshrut",
  storageBucket: "nash-marshrut.firebasestorage.app",
  messagingSenderId: "375493922120",
  appId: "1:375493922120:web:88285961179b686396377d"
};
let FS=null;
try{ firebase.initializeApp(firebaseConfig); FS=firebase.firestore(); try{ FS.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(_){} }catch(e){ console.error(e); }
const SEED_TRIP = {id:'nyc-2026', data:{name:'Нью-Йорк',city:'Нью-Йорк',members:['Алексей','Никита','Аня','Паша','Артем','Оля','Алина','София'],days:['2026-10-24','2026-10-25','2026-10-26','2026-10-27','2026-10-28'],center:{lat:40.742,lng:-73.975},createdAt:'2026-10-24T05:30:00.000Z'}};

/* ---------- state ---------- */
const S = {
  dbState:'loading', trips:[], places:[], loaded:{trips:false,places:false},
  tripId: LS.get('trip',null), tab:'places',
  f:{cat:'all',status:'all',sort:'votes',q:'',indoor:false,short:false},
  mapDay:'all', mapSel:null, confirmMember:null,
  offline:!navigator.onLine, here:null, scroll:{}, flash:null, stale:false
};
const trip = () => S.trips.find(t=>t.id===S.tripId) || null;
// Опорные точки (kind:'base'): жильё, аэропорт, точка сбора. Не голосуются, не в плане, всегда на карте.
const BASES = [
  {id:'home',name:'Жильё',svg:'<path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/>'},
  {id:'transport',name:'Аэропорт, вокзал',svg:'<path d="M3 13.5 21 7l-2.5 4.5L21 16zM9 11.3V6.5l3 3.3"/>'},
  {id:'meet',name:'Точка сбора',svg:'<path d="M6 21V4h11l-2.5 4L17 12H6"/>'},
  {id:'other',name:'Другое',svg:'<circle cx="12" cy="10" r="2.6"/><path d="M12 21s-6.5-5.9-6.5-11a6.5 6.5 0 0 1 13 0c0 5.1-6.5 11-6.5 11z"/>'}
];
const BASE = Object.fromEntries(BASES.map(b=>[b.id,b]));
const isBase = p => p&&p.kind==='base';
const tripAll = () => S.places.filter(p=>p.tripId===S.tripId);
const tripPlaces = () => tripAll().filter(p=>!isBase(p));
const tripBases = () => tripAll().filter(isBase);
const findAny = id => tripAll().find(x=>x.id===id);
const baseIcon = (p,cls='') => { const b=BASE[p.baseType]||BASE.other; return `<span class="bullet base ${cls}" title="${b.name}"><svg viewBox="0 0 24 24">${b.svg}</svg></span>`; };
const looksBase = n => /^(дом|жиль|квартир|отель|гостиниц|хостел|hotel|hostel|airbnb|апартамент|аэропорт|airport|вокзал|станция сбора)/i.test(String(n||'').trim());
const guessBaseType = n => /аэропорт|airport|вокзал|station|jfk|lga|ewr/i.test(n||'')?'transport':'home';
// Жильё для маршрута дня: если их несколько, ближайшее к первой остановке
function homeFor(stops){ const hs=tripBases().filter(p=>p.baseType==='home'&&hasPt(p)); if(!hs.length) return null; const s=(stops||[]).find(hasPt); return s?hs.reduce((a,b)=>haversine(a,s)<=haversine(b,s)?a:b):hs[0]; }
// Админ поездки: удаляет дни и меняет даты. Список в trip.admins, по умолчанию Алексей. Это защита от случайного нажатия, не от взлома: входа нет.
const admins = t => (t&&Array.isArray(t.admins)&&t.admins.length) ? t.admins : ['Алексей'];
const isAdmin = () => admins(trip()).includes(me());
const me = () => { const t=trip(); const n=t?LS.get('me:'+t.id,null):null; return (t&&n&&(t.members||[]).includes(n))?n:null; };

/* ---------- writes ---------- */
function flatten(obj,prefix,out){ out=out||[]; prefix=prefix||[]; for(const k of Object.keys(obj)){ const v=obj[k]; if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length) flatten(v,prefix.concat(k),out); else out.push(new firebase.firestore.FieldPath(...prefix.concat(k)), v); } return out; }
const ref=(col,id)=>{ const d=FS.collection(col).doc(id); return { set:data=>d.set(data), update:data=>d.update(...flatten(data)), delete:()=>d.delete() }; };
const placeRef=id=>ref('places',id), tripRef=id=>ref('trips',id);
// Несколько правок одним пакетом: [[коллекция, id, patch], ...]. Атомарно и без сети не застревает на первой.
function batch(ops){ const b=FS.batch(); for(const [col,id,data] of ops) b.update(FS.collection(col).doc(id),...flatten(data)); return b.commit(); }
function writeErr(e){ console.error(e); toast(e&&e.code==='permission-denied'?'База пока закрыта для записи. Владелец должен опубликовать правила.':e&&e.code==='not-found'?'Это место уже удалили.':'Не сохранилось. Проверь интернет и попробуй ещё раз.'); }
async function write(fn, okMsg){
  if(!FS){ toast('Нет связи с базой'); return false; }
  let pr; try{ pr=fn(); }catch(e){ writeErr(e); return false; }
  if(S.offline){ Promise.resolve(pr).catch(writeErr); if(okMsg) toast(okMsg+'. Отправлю, когда будет сеть'); return true; } // без сети Firestore держит запись в очереди
  try{ await pr; if(okMsg) toast(okMsg); return true; }
  catch(e){ writeErr(e); return false; }
}
// Чужие правки приходят в любой момент. Открытый <select> не трогаем, иначе на iPhone выбор теряется; дорисуем после blur.
const selectOpen = () => { const a=document.activeElement; return !!a&&a.tagName==='SELECT'&&$('#main').contains(a); };
function softRender(){
  if(selectOpen()){ S.stale=true; renderTop(); return; }
  render();
}
document.addEventListener('focusout',()=>{ if(S.stale){ S.stale=false; setTimeout(softRender,0); } });

/* ---------- place search (OpenStreetMap) ---------- */
// URL веб-приложения из google-maps-resolver.gs (…/exec). Разворачивает короткие ссылки maps.app.goo.gl:
// браузер сам не может (CORS). Пусто — такие ссылки ищем по названию.
const RESOLVER = 'https://script.google.com/macros/s/AKfycbzpF3itr_QbM8GMxa4Mfk4cnIxWieXGyiC7PRAr0a6SFoKV2vLrjCz7_FzP9P5nF5jK/exec';
const isGmaps = s => /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.)/i.test(String(s||''));
async function resolveLink(link){
  if(!RESOLVER||!isGmaps(link)) return null;
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),15000);
  try{ const r=await fetch(RESOLVER+'?url='+encodeURIComponent(link),{signal:ctl.signal}); return r.ok?await r.json():null; }
  catch(e){ return null; } finally{ clearTimeout(tm); }
}
// q из Google: «Katz's Delicatessen, 205 E Houston St, New York, NY 10002» или просто адрес «6507 Park Ave, West New York, NJ 07093»
function splitQ(q){
  const parts=String(q||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(!parts.length||/^-?\d+\.\d+$/.test(parts[0])) return {};
  const addr=/^\d/.test(parts[0])?parts:parts.slice(1);
  return {name:addr===parts?'':parts[0], address:addr.slice(0,2).join(', '), full:String(q).trim()};
}
let nomLast=0;
async function nominatim(path){ // политика Nominatim: не чаще раза в секунду
  const wait=nomLast+1100-Date.now(); nomLast=Date.now()+Math.max(0,wait); if(wait>0) await new Promise(r=>setTimeout(r,wait));
  const r=await fetch('https://nominatim.openstreetmap.org/'+path+'&format=jsonv2&addressdetails=1&accept-language=en'); if(!r.ok) return null;
  const j=await r.json(); const a=Array.isArray(j)?j[0]:j; return a&&a.lat?a:null;
}
function nomAddr(a){
  const ad=a.address||{}; const street=[ad.house_number,ad.road].filter(Boolean).join(' ');
  return { address: street||String(a.display_name||'').split(', ').slice(0,2).join(', '),
    area: [ad.quarter,ad.neighbourhood,ad.suburb,ad.city_district,ad.town,ad.village].find(x=>x&&!/community (board|district)|\bcounty\b/i.test(x))||'' }; // в NYC neighbourhood бывает «Community Board 3»
}
function catOf(a){ // тип объекта OSM → наша категория
  const t=a.type||'', c=a.category||'';
  if(/^(cafe|coffee|tea)$/.test(t)) return 'coffee';
  if(/^(restaurant|fast_food|food_court|ice_cream|bakery|deli|pastry|confectionery|cheese|seafood)$/.test(t)) return 'food';
  if(/^(museum|gallery|arts_centre)$/.test(t)) return 'museum';
  if(t==='viewpoint'||(c==='tourism'&&t==='attraction')) return 'view';
  if((c==='leisure'&&/^(park|garden|nature_reserve)$/.test(t))||c==='historic') return 'walk';
  if(c==='shop'||/^(mall|marketplace)$/.test(t)) return 'shop';
  return '';
}
async function findPlace(link,name,city,center){
  const out=parseLink(link); if(out.lat!=null) out.src='link';
  if(link&&(out.lat==null||!out.name)){
    const g=await resolveLink(link);
    if(g&&!g.error){
      const pl=parseLink(g.url||''), sq=splitQ(g.q); const c=g.lat!=null?g:(pl.lat!=null?pl:null);
      if(out.lat==null&&c){ out.lat=+c.lat; out.lng=+c.lng; out.src='google'; }
      out.name=out.name||pl.name||sq.name||''; out.full=sq.full; if(sq.address) out.address=sq.address; out.resolved=true;
    }
  }
  const what=out.name||name||'';
  try{
    if(what||out.full){
      const box=center&&center.lat!=null?`&viewbox=${center.lng-0.5},${center.lat+0.4},${center.lng+0.5},${center.lat-0.4}`:'';
      const withCity=city&&!what.toLowerCase().includes(city.toLowerCase())?what+', '+city:what;
      const qs=[...new Set([out.full&&what&&!out.full.startsWith(what)?what+', '+out.full:out.full, withCity, out.full].filter(Boolean))];
      let a=null; for(const q of qs){ a=await nominatim('search?limit=1&q='+encodeURIComponent(q)+box); if(a) break; }
      if(!a&&what&&box) a=await nominatim('search?limit=1&bounded=1&q='+encodeURIComponent(what)+box);
      if(a&&out.lat!=null&&haversine(out,{lat:+a.lat,lng:+a.lon})>0.3) a=null; // нашлась другая точка сети, а координаты из ссылки точнее
      if(a){ if(out.lat==null){ out.lat=+a.lat; out.lng=+a.lon; out.src='search'; } const na=nomAddr(a); out.address=out.address||na.address; out.area=na.area; out.cat=catOf(a); }
    }
    if(out.lat!=null&&!out.area){ const a=await nominatim(`reverse?zoom=18&lat=${out.lat}&lon=${out.lng}`); if(a){ const na=nomAddr(a); out.address=out.address||na.address; out.area=na.area; } }
  }catch(e){}
  if(/goo\.gl|maps\.app/.test(link||'')&&!out.resolved&&out.src!=='link') out.short=true;
  return out;
}
async function findCity(city){ try{ const a=await nominatim('search?limit=1&q='+encodeURIComponent(city)); return a?{lat:+a.lat,lng:+a.lon}:null; }catch(e){ return null; } }

/* ---------- map (Leaflet) ---------- */
// CARTO без ключа теперь отдаёт заглушку «API KEY REQUIRED». Берём тайлы OSM, тёмная тема — CSS-фильтр на .leaflet-tile-pane.
function tiles(){ return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:true,attribution:'© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}); }
class LMap{
  constructor(host,center){
    // Вид задаём сразу: слои, добавленные в карту без вида, Leaflet потом не может отрисовать (падает на 'load')
    const c=hasPt(center)?center:{lat:40.742,lng:-73.975};
    this.map=L.map(host,{zoomControl:false,attributionControl:true,center:[c.lat,c.lng],zoom:13});
    tiles().addTo(this.map); this.layer=L.layerGroup().addTo(this.map); this.hereL=L.layerGroup().addTo(this.map); this.routeL=null; this.onTap=null;
    this.map.on('click',()=>{ if(this.onTap) this.onTap(null); });
    this.inited=false; this.setHere(S.here);
  }
  setHere(h){
    this.hereL.clearLayers(); if(!h) return;
    if(h.acc>30) L.circle([h.lat,h.lng],{radius:Math.min(h.acc,2000),color:'#1a73e8',weight:1,fillOpacity:.1,interactive:false}).addTo(this.hereL);
    L.circleMarker([h.lat,h.lng],{radius:7,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1,interactive:false}).addTo(this.hereL);
  }
  home(center){ const c=hasPt(center)?center:{lat:40.742,lng:-73.975}; this.map.setView([c.lat,c.lng],13); this.inited=true; }
  setPins(list,{sel,numbered,route,dimIds,bases}={}){
    this.layer.clearLayers(); if(this.routeL){ this.routeL.remove(); this.routeL=null; }
    for(const p of (bases||[]).filter(hasPt)){
      const icon=L.divIcon({className:'lpin',html:baseIcon(p,sel===p.id?'sel':''),iconSize:[26,26],iconAnchor:[13,13]});
      L.marker([p.lat,p.lng],{icon,zIndexOffset:sel===p.id?1000:-100,keyboard:true,title:p.name}).addTo(this.layer).on('click',e=>{ L.DomEvent.stopPropagation(e); if(this.onTap) this.onTap(p.id); });
    }
    const r=(route||[]).filter(hasPt);
    if(r.length>1) this.routeL=L.polyline(r.map(p=>[p.lat,p.lng]),{color:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0d6a48',weight:4,opacity:.8}).addTo(this.map);
    for(const p of list.filter(hasPt)){
      const c=CAT[p.category]||CAT.other; const n=numbered&&numbered[p.id];
      const cls=[c.dark&&!n?'dark':'', sel===p.id?'sel':'', score(p)>=4?'hot':'', dimIds&&dimIds.has(p.id)?'dim':''].join(' ');
      const icon=L.divIcon({className:'lpin',html:`<span class="bullet ${cls}" style="--b:${n?'var(--accent)':c.c}">${n||c.l}</span>`,iconSize:[26,26],iconAnchor:[13,13]});
      const m=L.marker([p.lat,p.lng],{icon,zIndexOffset:sel===p.id?1000:0,keyboard:true,title:p.name}).addTo(this.layer);
      m.on('click',e=>{ L.DomEvent.stopPropagation(e); if(this.onTap) this.onTap(p.id); });
    }
  }
  fit(list,center){ const pts=(list||[]).filter(hasPt); if(!pts.length){ this.home(center); return; } if(pts.length===1){ this.map.setView([pts[0].lat,pts[0].lng],15); this.inited=true; return; } this.map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[50,50],maxZoom:16}); this.inited=true; }
  focus(p){ if(hasPt(p)){ this.map.setView([p.lat,p.lng],Math.max(this.map.getZoom()||15,15)); this.inited=true; } }
}
let mainMap=null, pickMap=null;

/* ---------- где я (только на этом телефоне, в базу не пишется) ---------- */
let geoWatch=null, geoWaiters=[], hereShown=null;
function locate(cb){
  if(cb){ if(S.here) cb(S.here); else geoWaiters.push(cb); }
  if(geoWatch!=null) return;
  if(!navigator.geolocation){ toast('Телефон не даёт определить место'); return; }
  geoWatch=navigator.geolocation.watchPosition(pos=>{
    S.here={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy};
    [mainMap,pickMap].forEach(m=>m&&m.setHere(S.here));
    const w=geoWaiters; geoWaiters=[]; w.forEach(f=>f(S.here));
    if(!hereShown||haversine(hereShown,S.here)>0.05){ hereShown=S.here; if(selectOpen()) S.stale=true; else if(S.tab==='places') renderList(); else if(S.tab==='map') renderMapCard(); } // не дёргать список на каждые пару метров
  }, err=>{
    navigator.geolocation.clearWatch(geoWatch); geoWatch=null; geoWaiters=[];
    toast(err.code===1?'Нет доступа к геолокации. Разреши его для браузера в настройках.':'Не получилось определить, где ты');
  }, {enableHighAccuracy:true, maximumAge:15000, timeout:20000});
}
const fromMe = p => S.here&&hasPt(p) ? haversine(S.here,p) : null;

/* Plan */
function plural(n,a,b,c){ const m10=n%10,m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c); }
function renderPlan(){
  const main=$('#main'); main.dataset.view='plan'; const t=trip(); const days=(t.days||[]).slice().sort();

  for(const d of days){
    const st=dayStops(d); const home=homeFor(st); let total=0; for(let i=1;i<st.length;i++) if(hasPt(st[i-1])&&hasPt(st[i])) total+=haversine(st[i-1],st[i]);
    const mins=st.reduce((s,p)=>s+dur(p),0);
    const areas=[...new Set(st.map(p=>p.area).filter(Boolean))];

      ${st.length?`<ol class="stops">${st.map((p,i)=>{ const prev=i>0?st[i-1]:home; const leg=prev&&hasPt(prev)&&hasPt(p)?haversine(prev,p):null; const c=CAT[p.category]||CAT.other; const tag=hasPt(p)?'button':'div'; return `<li class="stop"><span class="num ${p.done?'done':''}">${i+1}</span><${tag} class="nm" ${hasPt(p)?`data-act="show-map" data-id="${esc(p.id)}"`:''}><b>${esc(p.name)}</b><span>${c.name}${p.area?' · '+esc(p.area):''}${dur(p)?' · ~'+dur(p)+' мин':''}${p.booking?' · бронь':''}</span>${leg!=null?`<span class="leg">${i>0?'↑ '+km(leg)+' от предыдущего':km(leg)+' от жилья'}</span>`:''}</${tag}>
        <span class="mv"><button class="ico" data-act="mv" data-id="${esc(p.id)}" data-dir="-1" ${i===0?'disabled':''} aria-label="Выше">↑</button><button class="ico" data-act="mv" data-id="${esc(p.id)}" data-dir="1" ${i===st.length-1?'disabled':''} aria-label="Ниже">↓</button></span><button class="ico" data-act="unplan" data-id="${esc(p.id)}" aria-label="Убрать из дня">×</button></li>`; }).join('')}</ol>`:`<p class="hint" style="padding:12px">Пока ничего. Добавь места из списка идей.</p>`}
      <div class="day-f"><button class="btn small primary" data-act="add-to-day" data-day="${esc(d)}">+ Место</button>${st.some(hasPt)?`<button class="btn small" data-act="day-map" data-day="${esc(d)}">Карта дня</button>`:''}${dir?`<a class="btn small" href="${esc(dir)}" target="_blank" rel="noopener">${home?'Маршрут от жилья':'Маршрут в Google Maps'}</a>`:''}${st.length>(home?1:2)?`<button class="btn small ghost" data-act="sort-day" data-day="${esc(d)}">Упорядочить по пути</button>`:''}<span class="spacer"></span>${isAdmin()?`<button class="btn small ghost danger" data-act="rm-day" data-day="${esc(d)}">Удалить день</button>`:''}</div></section>`;
  }
  if(days.length) h+=`<div class="row"><button class="btn" data-act="add-day">+ Добавить день</button><span class="hint">Идей без дня: ${ideas}</span></div>`;
  h+=`</div>`; main.innerHTML=h;
}

      <div class="two"><div class="field"><label for="f-area">Район</label><input id="f-area" value="${esc(d.area)}" placeholder="Сохо" autocomplete="off"></div>
      <div class="field"><label for="f-addr">Адрес</label><input id="f-addr" value="${esc(d.address)}" placeholder="205 E Houston St" autocomplete="off"></div></div>
      <div class="field"><label for="f-why">${base?'Заметка':'Зачем идти'}</label><textarea id="f-why" placeholder="${base?'Код от двери, Wi-Fi, заселение с 15:00':'Легендарный пастрами, брать сэндвич на двоих'}">${esc(d.why)}</textarea></div>
      ${base?'':`<p class="hint" style="margin:-4px 0 12px">Это жильё, аэропорт или точка сбора? <button type="button" class="linkbtn" data-fact="as-base">Сделать опорной точкой</button></p>`}
      <details class="more" ${base?'hidden':''} ${d.price||d.duration||d.booking||d.indoor?'open':''}><summary>Подробности: цена, время, бронь</summary>
        <div class="two" style="margin-top:8px"><div class="field"><label for="f-price">Цена</label><select id="f-price">${['','бесплатно','$','$$','$$$'].map(x=>`<option value="${x}" ${d.price===x?'selected':''}>${x||'—'}</option>`).join('')}</select></div>
        <div class="field"><label for="f-dur">Сколько времени, мин</label><input id="f-dur" type="number" min="0" step="1" inputmode="numeric" placeholder="например, 80" value="${dur(d)||''}"></div></div>
        <label class="check"><input type="checkbox" id="f-book" ${d.booking?'checked':''}> Нужна бронь или билеты</label>
        <label class="check"><input type="checkbox" id="f-indoor" ${d.indoor?'checked':''}> В помещении (подходит на дождь)</label>
      </details>
      <div class="sheet-actions"><button class="btn primary" type="submit">${isNew?'Добавить':'Сохранить'}</button><button class="btn ghost" type="button" data-fact="cancel">Отмена</button><span class="spacer"></span>${isNew?'':`<button class="btn ghost danger" type="button" data-fact="del">Удалить</button>`}</div>
    </form>`, sheet=>{
    const read=()=>{ d.name=$('#f-name').value.trim(); d.link=$('#f-link').value.trim(); d.area=$('#f-area').value.trim(); d.address=$('#f-addr').value.trim(); d.why=$('#f-why').value.trim(); d.price=$('#f-price').value; d.duration=num($('#f-dur').value); d.booking=$('#f-book').checked; d.indoor=$('#f-indoor').checked; };
    const note=(t)=>{ $('#f-note').innerHTML=t?`<div class="find-res">${t}</div>`:''; };
    const fill=(id,v)=>{ const el=$(id); if(v&&!el.value.trim()) el.value=v; };
    // Мини-карта с точкой: видно, туда ли попали; тап — поправить
    let fm=null, pin=null;
    const pinIcon=()=>{ const c=CAT[d.category]||CAT.other; return L.divIcon({className:'lpin',html:base?baseIcon(d):`<span class="bullet ${c.dark?'dark':''}" style="--b:${c.c}">${c.l}</span>`,iconSize:[26,26],iconAnchor:[13,13]}); };
    const setPt=()=>{
      $('#f-pt').innerHTML = hasPt(d) ? `${PT_L[src]||PT_L.saved} <code>${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</code>` : 'Точки на карте пока нет';
      $('#f-pick').textContent = hasPt(d)?'Поправить на карте':'Указать на карте';
      const el=$('#f-map'); el.hidden=!hasPt(d); if(!hasPt(d)) return;
      if(!fm){ fm=L.map(el,{zoomControl:false,attributionControl:false,dragging:false,touchZoom:false,doubleClickZoom:false,scrollWheelZoom:false,boxZoom:false,keyboard:false,center:[d.lat,d.lng],zoom:16});
        tiles().addTo(fm); pin=L.marker([d.lat,d.lng],{icon:pinIcon(),interactive:false}).addTo(fm); fm.on('click',()=>pick()); setSheetCleanup(()=>fm.remove()); }
      else { fm.setView([d.lat,d.lng],16); pin.setLatLng([d.lat,d.lng]); }
      setTimeout(()=>fm.invalidateSize(),0);
    };
    const setCat=c=>{ d.category=c; sheet.querySelectorAll('[data-fcat]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.fcat===c)); if(pin) pin.setIcon(pinIcon()); };
    const pick=()=>{ read(); openPicker(d, pt=>{ d.lat=pt.lat; d.lng=pt.lng; src='manual'; setPt(); }); };
    const dup=()=>{
      const n=normName($('#f-name').value); const same=m=>m===n||(Math.min(m.length,n.length)>=4&&(m.includes(n)||n.includes(m)));
      const hit=n.length>=3&&(base?tripBases():tripPlaces()).find(x=>x.id!==d.id&&same(normName(x.name)));
      $('#f-dup').innerHTML=hit?`<div class="find-res warn">Похоже, уже есть: «${esc(hit.name)}»${hit.addedBy?`, добавил(а) ${esc(hit.addedBy)}`:''}.${isNew&&!base?' Можно просто проголосовать за него.':''}</div>`:'';
    };
    $('#f-name').addEventListener('input',dup); dup(); setPt();
    let finding=0;
    async function find(auto){
      read(); if(!d.link&&!d.name){ if(!auto) note('Вставь ссылку или напиши название.'); return; }
      const my=++finding; const b=$('#f-find'); b.disabled=true; b.textContent='Ищу…'; if(!auto||d.link) note('Ищу адрес и точку…');
      try{
        const r=await findPlace(d.link, d.name, t.city||'', t.center);
        if(my!==finding||!$('#f-find')) return; // форму закрыли или запустили новый поиск
        if(r.name){ fill('#f-name',r.name); dup(); }
        fill('#f-addr',r.address); fill('#f-area',r.area);
        if(r.cat&&!catTouched&&!base) setCat(r.cat);
        if(r.lat!=null&&(src===''||src==='search'||r.src!=='search')){ d.lat=r.lat; d.lng=r.lng; src=r.src; setPt(); }
        if(r.lat!=null) note(r.src==='search'?`Нашёл по названию: ${esc(r.address||r.name||'')}. Посмотри на мини-карте, то ли это место.`:`Готово: ${esc(r.address||r.name||'точка из ссылки')}.`);
        else if(r.short) note(RESOLVER?'Не получилось открыть ссылку. Напиши название, найду по нему, или поставь точку на карте.':'Короткую ссылку браузер открыть не может. Напиши название, найду по нему, или поставь точку на карте.');
        else note(auto&&!d.link?'':'Не нашёл. Уточни название (добавь район) или поставь точку на карте.');
      }catch(e){ note('Поиск сейчас не работает. Поставь точку на карте вручную.'); }
      finally{ if(my===finding&&$('#f-find')){ b.disabled=false; b.textContent='Найти адрес и точку'; } }
    }
    const onLink=()=>{ const r=parseLink($('#f-link').value); if(r.name){ fill('#f-name',r.name); dup(); } if(r.lat!=null){ d.lat=r.lat; d.lng=r.lng; src='link'; setPt(); } if($('#f-link').value.trim()&&(r.lat==null||!$('#f-addr').value.trim())) find(true); };
    // Текст из «Поделиться» бывает «Название\nАдрес\nhttps://maps.app.goo.gl/…»; в однострочном поле переносы склеились бы
    const takeText=txt=>{
      const u=String(txt).match(/https?:\/\/\S+/);
      if(!u){ fill('#f-name',String(txt).trim().split(/\r?\n/)[0].slice(0,120)); dup(); find(true); return; }
      $('#f-link').value=u[0];
      const lines=txt.replace(u[0],'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      if(lines[0]&&lines[0].length<80){ fill('#f-name',lines[0]); dup(); }
      if(lines[1]&&/\d/.test(lines[1])&&lines[1].length<120) fill('#f-addr',lines[1]);
      onLink();
    };
    $('#f-link').addEventListener('change',onLink);
    $('#f-link').addEventListener('paste',e=>{ const txt=(e.clipboardData&&e.clipboardData.getData('text'))||''; if(!txt.trim()) return; e.preventDefault(); takeText(txt); });
    sheet.querySelectorAll('[data-fcat]').forEach(b=>b.addEventListener('click',()=>{ catTouched=true; setCat(b.dataset.fcat); }));
    sheet.querySelectorAll('[data-fbt]').forEach(b=>b.addEventListener('click',()=>{ d.baseType=b.dataset.fbt; sheet.querySelectorAll('[data-fbt]').forEach(x=>x.setAttribute('aria-pressed',x===b)); if(pin) pin.setIcon(pinIcon()); }));
    let delArmed=false;
    sheet.addEventListener('click',async e=>{
      const a=e.target.closest('[data-fact]'); if(!a) return; const act=a.dataset.fact;
      if(act==='cancel') closeSheet();
      if(act==='find') find(false);
      if(act==='pick') pick();
      if(act==='as-base'){ read(); openPlaceForm(Object.assign({},p||{},d,{baseType:guessBaseType(d.name)}),{base:true}); }
      if(act==='paste'){ try{ const txt=await navigator.clipboard.readText(); if(txt&&txt.trim()) takeText(txt); else toast('В буфере пусто'); }catch(_){ $('#f-link').focus(); toast('Вставь ссылку в поле: долгое нажатие → «Вставить»'); } }
      if(act==='del'){
        if(!delArmed){ delArmed=true; a.textContent='Точно удалить?'; return; }
        if(await write(()=>placeRef(p.id).delete(),'Место удалено')){ if(S.mapSel===p.id) S.mapSel=null; closeSheet(); }
      }
    });
    sheet.querySelector('form').addEventListener('submit', async e=>{
      e.preventDefault(); read(); if(!d.name){ $('#f-name').focus(); return; }
      const body={tripId:t.id,name:d.name,category:d.category,area:d.area,address:d.address,why:d.why,link:d.link,lat:hasPt(d)?d.lat:null,lng:hasPt(d)?d.lng:null,price:d.price||'',duration:dur(d)||null,booking:!!d.booking,indoor:!!d.indoor};
      if(base) Object.assign(body,{kind:'base',baseType:d.baseType,category:'other',day:'',done:false});
      closeSheet();
      if(isNew&&base){ await write(()=>placeRef(newId('p')).set({...body,addedBy:me()||'',createdAt:new Date().toISOString(),order:0,votes:{}}),'Опорная точка добавлена'); }
      else if(isNew){ const id=newId('p'); S.flash=id;
        if(S.f.cat!=='all'&&S.f.cat!==d.category) S.f.cat='all'; if(!['all','idea'].includes(S.f.status)) S.f.status='all'; if(S.f.q){ S.f.q=''; const q=$('#q'); if(q) q.value=''; } S.f.indoor=S.f.short=false; // чтобы новое место было видно
        await write(()=>placeRef(id).set({...body,addedBy:me()||'',createdAt:new Date().toISOString(),day:'',done:false,order:0,votes:me()?{[me()]:2}:{}}),'Место добавлено'); }
      else await write(()=>placeRef(p.id).update(body),'Сохранено');
    });
    if(!isNew&&!hasPt(d)&&(d.link||d.name)) find(true); // у старого места нет точки: сразу пробуем найти
  });
}

function openPicker(d, done){
  const t=trip(); const el=document.createElement('div'); el.className='picker';
  el.innerHTML=`<div class="pm"><div class="lhost" id="pick-map"></div><div class="cross"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="6"/><path d="M18 2v10M18 24v10M2 18h10M24 18h10"/></svg></div><div class="map-zoom"><button data-pk="me" aria-label="Где я">${LOCATE_SVG}</button></div></div>
    <div class="picker-bar"><p>Двигай карту, чтобы крестик встал на «${esc(d.name||'новое место')}».</p><button class="btn" data-pk="cancel">Отмена</button><button class="btn primary" data-pk="ok">Поставить здесь</button></div>`;
  document.body.appendChild(el);
  const lm=pickMap=new LMap(el.querySelector('#pick-map'),hasPt(d)?d:t.center);
  const others=tripPlaces().filter(p=>hasPt(p)&&p.id!==d.id);
  lm.setPins(others,{dimIds:new Set(others.map(p=>p.id))});
  setTimeout(()=>{ lm.map.invalidateSize(); if(hasPt(d)) lm.map.setView([d.lat,d.lng],16); else lm.home(t.center); },0);
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-pk]'); if(!b) return;
    if(b.dataset.pk==='me'){ locate(h=>{ if(pickMap===lm) lm.map.setView([h.lat,h.lng],17); }); return; }
    if(b.dataset.pk==='ok'){ const c=lm.map.getCenter(); done({lat:+c.lat.toFixed(6),lng:+c.lng.toFixed(6)}); }
    lm.map.remove(); el.remove(); pickMap=null;
  });
}

function openDayPicker(day){
  const st=dayStops(day); const pts=st.filter(hasPt);
  const cen = pts.length?{lat:pts.reduce((s,p)=>s+p.lat,0)/pts.length,lng:pts.reduce((s,p)=>s+p.lng,0)/pts.length}:null;
  const cands=tripPlaces().filter(p=>!p.day&&!p.done).map(p=>({p,d:cen&&hasPt(p)?haversine(cen,p):null})).sort((a,b)=>cen?((a.d??99)-(b.d??99)):(score(b.p)-score(a.p)));
  openSheet(`<h2>${esc(fmtDay(day,true))}</h2><p class="hint" style="margin-bottom:12px">${cen?'Сначала то, что ближе к уже выбранным местам этого дня.':'Сначала самые популярные идеи.'}</p>
    <div class="pick-list">${cands.length?cands.map(({p,d})=>{const c=CAT[p.category]||CAT.other; return `<button class="pick-item" data-act="plan-add" data-id="${esc(p.id)}" data-day="${esc(day)}"><span class="bullet sm ${c.dark?'dark':''}" style="--b:${c.c}">${c.l}</span><div class="nm">${esc(p.name)}<span>${[p.area&&esc(p.area), 'голоса '+(score(p)>0?'+':'')+score(p), d!=null?km(d)+' от дня':''].filter(Boolean).join(' · ')}</span></div><span class="btn small">Добавить</span></button>`}).join(''):'<p class="hint">Все идеи уже разложены по дням. Добавь новые места во вкладке «Места».</p>'}</div>
    <div class="sheet-actions"><button class="btn ghost" data-act="close-sheet">Готово</button></div>`);
}
function openAdminsForm(){
  const t=trip(); const sel=new Set(admins(t).filter(n=>(t.members||[]).includes(n)));
  openSheet(`<h2>Админы</h2><p class="hint" style="margin-bottom:12px">Админы удаляют дни, меняют даты поездки и назначают других админов.</p>
    <div class="people" id="adm">${(t.members||[]).map(n=>`<button type="button" class="chip nobullet" data-adm="${esc(n)}" aria-pressed="${sel.has(n)}">${esc(n)}</button>`).join('')}</div>
    <div class="sheet-actions" style="margin-top:14px"><button class="btn primary" data-fact="save">Сохранить</button><button class="btn ghost" data-act="close-sheet">Отмена</button></div>`, sheet=>{
    sheet.addEventListener('click',async e=>{
      const c=e.target.closest('[data-adm]');
      if(c){ const n=c.dataset.adm; if(sel.has(n)) sel.delete(n); else sel.add(n); c.setAttribute('aria-pressed',sel.has(n)); return; }
      if(e.target.closest('[data-fact="save"]')){
        if(!sel.size){ toast('Нужен хотя бы один админ'); return; }
        const list=(t.members||[]).filter(n=>sel.has(n)); closeSheet();
        await write(()=>tripRef(t.id).update({admins:list}),'Админы: '+list.join(', '));
      }
    });
  });
}
function openAddDay(){
  const t=trip(); const days=(t.days||[]).slice().sort(); const def=days.length?addDays(days[days.length-1],1):todayISO();
  openSheet(`<h2>Добавить день</h2><form data-form="add-day"><div class="field"><label for="d-date">Дата</label><input id="d-date" type="date" value="${esc(def)}" required></div><div class="sheet-actions"><button class="btn primary" type="submit">Добавить</button><button class="btn ghost" type="button" data-act="close-sheet">Отмена</button></div></form>`);
}
function openTripForm(existing){
  const t=existing; const cur=trip(); const days=t?(t.days||[]).slice().sort():[];
  openSheet(`<h2>${t?'Поездка':'Новая поездка'}</h2><form data-form="trip" data-id="${t?esc(t.id):''}">
    <div class="field"><label for="t-name">Название *</label><input id="t-name" required value="${esc(t?t.name:'')}" placeholder="Чикаго, весна" autocomplete="off"></div>
    <div class="field"><label for="t-city">Город</label><input id="t-city" value="${esc(t?t.city:'')}" placeholder="Чикаго" autocomplete="off"></div>
    <div class="two"><div class="field"><label for="t-start">Первый день</label><input id="t-start" type="date" value="${esc(days[0]||'')}" ${t&&!isAdmin()?'disabled':''}></div><div class="field"><label for="t-end">Последний день</label><input id="t-end" type="date" value="${esc(days[days.length-1]||'')}" ${t&&!isAdmin()?'disabled':''}></div></div>
    ${t&&!isAdmin()?`<p class="hint" style="margin:-4px 0 12px">Даты меняет админ: ${esc(admins(t).join(', '))}.</p>`:''}
    ${t?'':`<label class="check"><input type="checkbox" id="t-copy" ${cur?'checked':''}> Взять участников из «${esc(cur?cur.name:'')}»</label>`}
    <div class="sheet-actions"><button class="btn primary" type="submit">${t?'Сохранить':'Создать'}</button><button class="btn ghost" type="button" data-act="close-sheet">Отмена</button></div></form>`,
    sheet=>{ const f=sheet.querySelector('form'); f.dataset.s0=$('#t-start').value; f.dataset.e0=$('#t-end').value; }); // что реально показано в полях, чтобы понять, меняли ли даты
}

/* ---------- actions ---------- */
document.addEventListener('click', async e=>{
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act; const id=a.dataset.id;
  const t=trip();
  switch(act){
    case 'tab': {
      const main=$('#main'), prev=S.tab; S.scroll[prev]=main.scrollTop; S.tab=a.dataset.tab; render();
      if(S.tab==='plan'&&prev!=='plan'){ const td=$('#day-today'); if(td) td.scrollIntoView({block:'start'}); else main.scrollTop=0; }
      else if(S.tab!==prev) main.scrollTop=S.scroll[S.tab]||0;
      break; }
    case 'pick-me': openMePicker(); break;
    case 'set-me': LS.set('me:'+S.tripId,a.dataset.name); closeSheet(); render(); break;
    case 'add': if(!me()){ openMePicker(); toast('Сначала выбери, кто ты'); } else openPlaceForm(null); break;
    case 'edit': { const p=findAny(id); if(p) openPlaceForm(p); else toast('Это место уже удалили'); break; }
    case 'cat': S.f.cat=a.dataset.cat; render(); break;
    case 'status': S.f.status=a.dataset.st; render(); break;
    case 'qf': S.f[a.dataset.k]=!S.f[a.dataset.k]; render(); break;
    case 'reset-f': { S.f={cat:'all',status:'all',sort:S.f.sort,q:'',indoor:false,short:false}; const q=$('#q'); if(q) q.value=''; render(); break; }
    case 'vote': {
      const m=me(); if(!m){ openMePicker(); return; }
      const p=tripPlaces().find(x=>x.id===id); if(!p) return; const cur=(p.votes||{})[m]; const v=+a.dataset.v;
      await write(()=>placeRef(id).update({votes:{[m]:cur===v?0:v}})); break; }
    case 'done': { const p=tripPlaces().find(x=>x.id===id); if(p) await write(()=>placeRef(id).update({done:!p.done})); break; }
    case 'show-map': { const p=findAny(id); if(!p) return;
      S.scroll[S.tab]=$('#main').scrollTop; S.mapDay=S.tab==='plan'&&p.day?p.day:'all'; S.tab='map'; S.mapSel=id; S.f.cat='all'; render(); mainMap.focus(p); break; }
    case 'add-base': openPlaceForm(null,{base:true}); break;
    case 'to-base': { const p=findAny(id); if(p) await write(()=>placeRef(id).update({kind:'base',baseType:guessBaseType(p.name),day:'',done:false}),'«'+p.name+'» теперь опорная точка'); break; }
    case 'go-home': { const h=homeFor(); if(!h) return; S.mapSel=h.id; mainMap.focus(h); updateMapPins(); renderMapCard(); break; }
    case 'locate': if(!S.here) toast('Определяю, где ты…'); locate(h=>{ if(mainMap&&S.tab==='map') mainMap.map.setView([h.lat,h.lng],Math.max(mainMap.map.getZoom()||15,15)); }); break;
    case 'sel': S.mapSel=id; { const p=findAny(id); if(p) mainMap.focus(p); } updateMapPins(); renderMapCard(); break;
    case 'close-card': S.mapSel=null; updateMapPins(); renderMapCard(); break;
    case 'zin': mainMap.map.zoomIn(); break;
    case 'zout': mainMap.map.zoomOut(); break;
    case 'fit': mainMap.fit(mapList(),t.center); break;
    case 'day-map': S.scroll[S.tab]=$('#main').scrollTop; S.tab='map'; S.mapDay=a.dataset.day; S.mapSel=null; render(); mainMap.fit(dayStops(a.dataset.day),t.center); break;
    case 'add-day': openAddDay(); break;
    case 'edit-admins': if(isAdmin()) openAdminsForm(); break;
    case 'add-to-day': openDayPicker(a.dataset.day); break;
    case 'plan-add': { const d=a.dataset.day; const order=dayStops(d).reduce((m,p)=>Math.max(m,p.order??0),0)+1; a.closest('.pick-item').remove(); await write(()=>placeRef(id).update({day:d,order})); break; }
    case 'close-sheet': closeSheet(); break;
    case 'nag-go': closeSheet(); { const b=$('[data-act="tab"][data-tab="plan"]'); if(b) b.click(); } break;
    case 'unplan': await write(()=>placeRef(id).update({day:''})); break;
    case 'mv': {
      const p=tripPlaces().find(x=>x.id===id); if(!p||!p.day) return; const st=dayStops(p.day); const i=st.findIndex(x=>x.id===id); const j=i+(+a.dataset.dir); if(j<0||j>=st.length) return;
      const arr=st.slice(); [arr[i],arr[j]]=[arr[j],arr[i]];
      await reorder(arr); break; }
    case 'sort-day': {
      // Пересборка стирает ручной порядок: сначала подтверждение, потом можно вернуть
      if(a.dataset.armed!=='1'){ a.dataset.armed='1'; a.textContent='Точно пересобрать?'; setTimeout(()=>{ if(a.isConnected){ a.dataset.armed=''; a.textContent='Упорядочить по пути'; } },4000); return; }
      const st=dayStops(a.dataset.day); const before=st.map(p=>['places',p.id,{order:p.order??0}]); const withPt=st.filter(hasPt), without=st.filter(p=>!hasPt(p)); const home=homeFor(st);
      if(withPt.length<(home?2:3)){ toast('Нужно хотя бы '+(home?2:3)+' места с точками'); return; }
      const route=[], left=withPt.slice(); let last=home||left.shift(); if(!home) route.push(last);
      while(left.length){ let bi=0,bd=1e9; left.forEach((p,i)=>{const d=haversine(last,p); if(d<bd){bd=d;bi=i}}); last=left.splice(bi,1)[0]; route.push(last); }
      await reorder(route.concat(without));
      toast(home?'Порядок пересобран от жилья.':'Порядок пересобран от первого места.',{label:'Вернуть как было',fn:()=>write(()=>batch(before),'Порядок возвращён')}); break; }
    case 'rm-day': { if(!isAdmin()){ toast('Удалять дни может только админ: '+admins(t).join(', ')); return; }
      const d=a.dataset.day; if(a.dataset.armed!=='1'){ a.dataset.armed='1'; a.textContent='Точно удалить?'; return; }
      const ops=dayStops(d).map(p=>['places',p.id,{day:''}]); ops.push(['trips',t.id,{days:(t.days||[]).filter(x=>x!==d)}]);
      await write(()=>batch(ops),'День удалён'); break; }
    case 'edit-trip': openTripForm(t); break;
    case 'new-trip': openTripForm(null); break;
    case 'switch-trip': S.tripId=id; LS.set('trip',id); S.mapSel=null; S.mapDay='all'; S.askedMe=false; S.tab='places'; render(); break;
    case 'rm-member': {
      const n=a.dataset.name; if(S.confirmMember!==n){ S.confirmMember=n; render(); return; }
      S.confirmMember=null; await write(()=>tripRef(t.id).update({members:(t.members||[]).filter(x=>x!==n)})); break; }
  }
});
async function reorder(arr){ const ops=arr.map((p,k)=>['places',p.id,{order:k+1}]).filter((o,k)=>(arr[k].order??-1)!==k+1); if(ops.length) await write(()=>batch(ops)); }
document.addEventListener('change', async e=>{
  const el=e.target; if(el.tagName==='SELECT') el.blur(); // см. softRender
  if(el.matches('[data-act="set-day"]')){ const d=el.value; const order=d?dayStops(d).reduce((m,p)=>Math.max(m,p.order??0),0)+1:0; await write(()=>placeRef(el.dataset.id).update({day:d,order})); }
  if(el.id==='sort'){ S.f.sort=el.value; if(el.value==='near'&&!S.here){ toast('Определяю, где ты…'); locate(); } renderList(); }
  if(el.id==='map-day'){ S.mapDay=el.value; S.mapSel=null; updateMapPins(); renderMapCard(); if(S.mapDay!=='all') mainMap.fit(mapList(),trip().center); }
});
document.addEventListener('input', e=>{ if(e.target.id==='q'){ S.f.q=e.target.value; renderList(); } });
document.addEventListener('submit', async e=>{
  const f=e.target; const kind=f.dataset.form; if(!kind||kind==='place') return; e.preventDefault(); const t=trip();
  if(kind==='add-member'){ const n=$('#new-member').value.trim(); if(!n) return; if((t.members||[]).some(x=>x.toLowerCase()===n.toLowerCase())){ toast('Такой участник уже есть'); return; } $('#new-member').value=''; await write(()=>tripRef(t.id).update({members:[...(t.members||[]),n]})); }
  if(kind==='add-day'){ const d=$('#d-date').value; if(!d) return; if((t.days||[]).includes(d)){ toast('Этот день уже есть'); return; } closeSheet(); await write(()=>tripRef(t.id).update({days:[...(t.days||[]),d].sort()}),'День добавлен'); }
  if(kind==='trip'){
    const name=$('#t-name').value.trim(), city=$('#t-city').value.trim(), s=$('#t-start').value, en=$('#t-end').value; if(!name) return;
    let range=[]; if(s){ const end=en&&en>=s?en:s; for(let d=s, i=0; d<=end&&i<60; d=addDays(d,1), i++) range.push(d); }
    const ex=f.dataset.id?S.trips.find(x=>x.id===f.dataset.id):null;
    const sb=f.querySelector('[type=submit]'); sb.disabled=true; sb.textContent='Сохраняю…';
    const center=city&&(!ex||city!==ex.city)?await findCity(city):null;
    if(ex){
      // Даты трогаем, только если их правда поменяли; дни, где уже есть места, не выкидываем
      let days=ex.days||[]; if(isAdmin()&&(s!==f.dataset.s0||en!==f.dataset.e0)){ const used=new Set(S.places.filter(p=>p.tripId===ex.id&&p.day).map(p=>p.day)); days=[...new Set([...range,...days.filter(d=>used.has(d))])].sort(); }
      closeSheet(); await write(()=>tripRef(ex.id).update({name,city,days,...(center?{center}:{})}),'Сохранено'); }
    else{
      const nid=newId('t'); const copy=$('#t-copy')&&$('#t-copy').checked&&t; const members=copy?(t.members||[]).slice():[];
      closeSheet();
      if(await write(()=>tripRef(nid).set({name,city,days:range,members,center,admins:me()?[me()]:[],createdAt:new Date().toISOString()}),'Поездка создана')){
        if(copy&&me()) LS.set('me:'+nid,me()); S.tripId=nid; LS.set('trip',nid); S.askedMe=false; S.tab=members.length?'places':'trip'; render(); }
    }
  }
});

/* ---------- boot ---------- */
function pickTrip(){
  if(S.trips.some(t=>t.id===S.tripId)) return;
  const sorted=S.trips.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')); S.tripId=sorted[0]?sorted[0].id:null;
}
// iOS приближает страницу при тапе в поле со шрифтом меньше 16px. maximum-scale это отключает, а щипком масштабировать iOS всё равно даёт.
if(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){ const v=$('meta[name=viewport]'); if(v) v.content+=', maximum-scale=1'; }
// Офлайн-оболочка (sw.js): без сети приложение всё равно откроется, данные даст кэш Firestore
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e));
addEventListener('online',()=>{ S.offline=false; renderTop(); });
addEventListener('offline',()=>{ S.offline=true; renderTop(); });
render();
if(!FS){ S.dbState='none'; render(); }
else{
  const err=e=>{ console.error(e); S.dbState='error'; render(); };
  let seeded=false;
  FS.collection('trips').onSnapshot(s=>{
    S.trips=s.docs.map(d=>({id:d.id,...d.data()}));
    S.loaded.trips=S.loaded.trips||S.trips.length>0||!s.metadata.fromCache; // пустой кэш при первом заходе ещё не значит «поездок нет»
    if(!S.loaded.trips) return;
    if(!S.trips.length&&!s.metadata.fromCache&&!seeded){ seeded=true; FS.collection('trips').doc(SEED_TRIP.id).set(SEED_TRIP.data).catch(err); }
    pickTrip(); if(S.loaded.places){ S.dbState='ok'; softRender(); }
  }, err);
  FS.collection('places').onSnapshot(s=>{
    S.places=s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.places=true;
    if(S.loaded.trips){ S.dbState='ok'; softRender(); }
  }, err);
}
</script>
</body>
</html>
